<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>VK Toolkit</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">VK</span><div><h1>VK Toolkit</h1><small>Версия 0.2.1</small></div></header>
  <form id="settings">
    <section class="module"><label class="module-title"><input type="checkbox" name="module.dialogs"><span><b>Диалоги</b><small>Экспорт полной истории в ZIP</small></span></label></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.debug"><span><b>Debug</b><small>ID сообщений при наведении</small></span></label><label class="option"><input type="checkbox" name="debug.showMessageIds"> Показывать ID сообщений</label></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.photos"><span><b>Фото</b><small>Ссылка на максимальный оригинал</small></span></label></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.ui"><span><b>Интерфейс</b><small>Настройки внешнего вида VK</small></span></label><div class="options"><label><input type="checkbox" name="ui.hideClips"> Скрывать клипы</label><label><input type="checkbox" name="ui.hideStories"> Скрывать истории</label><label><input type="checkbox" name="ui.compactMenu"> Компактное меню</label><label for="customCss">Пользовательский CSS</label><textarea id="customCss" name="ui.customCss" rows="3" placeholder="/* Ваш CSS */"></textarea></div></section>
    <button type="submit">Сохранить</button><output id="status" aria-live="polite"></output>
  </form><script src="popup.js"></script>
</body></html>
