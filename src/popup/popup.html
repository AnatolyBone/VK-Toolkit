<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>VK Toolkit</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">VK</span><div><h1>VK Toolkit</h1><small>Версия 0.9.1</small></div></header>
  <form id="settings">
    <section class="module"><label class="module-title"><input type="checkbox" name="module.dialogs"><span><b>Диалоги</b><small>Проверяемый локальный архив</small></span></label><div class="options"><label><input type="checkbox" name="dialogs.incremental"> Только новые сообщения</label><label><input type="checkbox" name="dialogs.anonymize"> Обезличить имена и ID</label><label><input type="checkbox" name="dialogs.includeAttachments"> Сохранять вложения и ссылки</label><label><input type="checkbox" name="dialogs.downloadMedia"> Скачивать медиа в архив (медленнее)</label><small>Отключите скачивание медиа для быстрого экспорта: ссылки на вложения останутся в сообщениях.</small><label><input type="checkbox" name="dialogs.encrypt"> Шифровать архив паролем</label><small>Пароль вы придумываете при экспорте. Он не сохраняется и потребуется для расшифровки.</small><a class="tool-link" href="../tools/unlock.html" target="_blank">Открыть расшифровщик</a><button type="button" class="secondary" id="resetArchives">Сбросить историю экспортов и сборов</button></div></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.debug"><span><b>Debug</b><small>ID сообщений при наведении</small></span></label><label class="option"><input type="checkbox" name="debug.showMessageIds"> Показывать ID сообщений</label></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.photos"><span><b>Фото</b><small>Ссылка на максимальный оригинал</small></span></label></section>
    <section class="module"><label class="module-title"><input type="checkbox" name="module.ui"><span><b>Интерфейс</b><small>Настройки внешнего вида VK</small></span></label><div class="options"><label><input type="checkbox" name="ui.hideClips"> Скрывать клипы</label><label><input type="checkbox" name="ui.hideStories"> Скрывать истории</label><label><input type="checkbox" name="ui.compactMenu"> Компактное меню</label><label for="customCss">Пользовательский CSS</label><textarea id="customCss" name="ui.customCss" rows="3" placeholder="/* Ваш CSS */"></textarea></div></section>
    <section class="module"><div class="module-title"><span><b>Кэш медиа</b><small id="mediaCacheStatus">Подсчёт…</small></span></div><button type="button" class="secondary" id="clearMediaCache">Очистить кэш</button></section>
    <button type="submit">Сохранить</button><output id="status" aria-live="polite"></output>
  </form><script src="popup.js"></script>
</body></html>
